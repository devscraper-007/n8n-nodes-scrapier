name: Regenerate catalog

# Weekly check of the live Scrapier endpoint catalog. The generator rebuilds
# nodes/Scrapier/catalog.json and the README facts from
# https://proxy.scrapier.io/api/v2/endpoints; if anything changed, a pull
# request is opened for a human to review. This workflow NEVER publishes to
# npm and NEVER creates a tag: releasing stays a manual step (bump version,
# push a v* tag -> publish.yml).
#
# The run fails (and GitHub notifies the maintainers) when the catalog looks
# truncated, shrank by more than 20%, or a curated endpoint was removed or
# disabled. Repo setting required: Settings > Actions > General > "Allow
# GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '23 5 * * 1'   # Mondays 05:23 UTC
  workflow_dispatch:

concurrency:
  group: regenerate-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the automation branch
      pull-requests: write   # open / update the PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Check the shared generator helper
        run: |
          python3 scripts/catalog_source.py --self-test
          python3 -m py_compile scripts/catalog_source.py scripts/generate-catalog.py
      # Fetch once and keep the copy: the generator and the test step both read it,
      # so the credit cross-check in `npm test` compares against the same catalog.
      - name: Fetch the live catalog
        run: |
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 5 --max-time 60 \
            -H 'User-Agent: scrapier-connector-generator/1 (+https://app.scrapier.io)' \
            -o "$RUNNER_TEMP/endpoints.json" https://proxy.scrapier.io/api/v2/endpoints
      - name: Regenerate from the fetched catalog
        run: python3 scripts/generate-catalog.py --source "$RUNNER_TEMP/endpoints.json" --summary-file "$RUNNER_TEMP/catalog-review.md"
      - name: Show the review summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/catalog-review.md" ]; then cat "$RUNNER_TEMP/catalog-review.md" >> "$GITHUB_STEP_SUMMARY"; fi
      # --ignore-scripts skips native builds of transitive dev deps (see publish.yml).
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Test (with the credit cross-check against the fetched catalog)
        run: npm test
        env:
          ENDPOINTS_JSON: ${{ runner.temp }}/endpoints.json
      - name: Open a pull request if the output changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/regenerate-catalog
          delete-branch: true
          add-paths: |
            nodes/Scrapier/catalog.json
            scripts/catalog-index.json
            README.md
          commit-message: 'chore(catalog): regenerate from the live Scrapier catalog'
          title: 'chore(catalog): regenerate from the live Scrapier catalog'
          body-path: ${{ runner.temp }}/catalog-review.md
